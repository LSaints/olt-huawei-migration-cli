[tool.setuptools.packages]
find = {}

[project]
name = "oltcli"
version = "0.1.0"
authors = [{ name = "Mateus Leandro", email = "lsants.dev@gmail.com" }]
description  = "App terminal para facilitar a migração de clientes de uma PON para outra"
requires-python = ">=3.13"
dependencies = [
    "colorama==0.4.6",
    "linkify-it-py==2.0.3",
    "markdown-it-py==3.0.0",
    "mdit-py-plugins==0.4.2",
    "mdurl==0.1.2",
    "platformdirs==4.3.8",
    "Pygments==2.19.1",
    "rich==14.0.0",
    "telnetlib3==2.0.4",
    "textual==3.2.0",
    "typing_extensions==4.13.2",
    "uc-micro-py==1.0.3"
]

[project.scripts]
meuapp = "main:main"

